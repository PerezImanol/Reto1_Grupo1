<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CentroGestor - Usuarios</title>
    <link rel="icon" href="../img/icon.png">

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/equipamiento.css">
    <link rel="stylesheet" href="../css/tema.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/usuarios.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="contenido">
            <h1>Usuarios</h1>
            <div class="barra-herramientas">
                <div class="grupo-busqueda">
                    <input type="search" id="buscarUsuario" class="buscador" placeholder="Buscar usuario..."
                        aria-label="Buscar usuario">
                </div>

                <div class="acciones-equipamientos">
                    <button id="btnAnadir" class="boton-icono boton-anadir" aria-label="Añadir usuario"
                        title="Añadir usuario">
                        <img src="../img/añadir.png" alt="">
                    </button>

                    <button id="btnBorrar" class="boton-icono boton-borrar" aria-label="Borrar usuario"
                        title="Borrar usuario" disabled>
                        <img src="../img/borrar.png" alt="">
                    </button>
                </div>
            </div>
            <p class="mensaje-pagina-equipamientos" id="mensajeUsuarios" role="status" aria-live="polite" hidden></p>
            <table>
                <thead>
                    <tr>
                        <th class="columna-seleccion"></th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Nombre de usuario</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="tablaEquipamientos">
                    <tr>
                        <td colspan="5" class="tabla-vacia">Cargando usuarios...</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="seccionModificar" class="modificar" hidden>
            <form id="formEquipamiento" hidden>
                <h2 id="tituloFormulario">Modificar usuario</h2>
                <div class="campos-formulario">
                    <label>Nombre<input type="text" id="name" required></label>
                    <label>Apellidos<input type="text" id="surname" required></label>
                    <label>Nombre de usuario<input type="text" id="username" autocomplete="off" required></label>
                    <label>Rol<select id="role" required>
                            <option value="user">USER</option>
                            <option value="admin">ADMIN</option>
                        </select></label>
                    <label id="oldPasswordLabel" hidden>Contraseña actual<input type="password" id="oldPassword"
                            autocomplete="current-password"></label>
                    <label>Contraseña nueva<input type="password" id="password" autocomplete="new-password"
                            required></label>
                    <label>Confirmar contraseña<input type="password" id="passwordConfirm" autocomplete="new-password"
                            required></label>
                </div>
                <div class="botones-formulario">
                    <button type="submit" class="boton-accion">Guardar</button>
                    <button type="button" id="btnCancelar" class="boton-accion boton-cancelar">Cancelar</button>
                </div>
            </form>
        </section>
    </main>
    <div id="modalConfirmarBorrado" class="modal-confirmacion" hidden>
        <div class="contenido-modal" role="dialog" aria-modal="true" aria-labelledby="textoConfirmacionBorrado">
            <img src="../img/borrar.png" alt="" class="icono-confirmacion">
            <p id="textoConfirmacionBorrado">¿Seguro que quieres eliminar este usuario? No podrá iniciar sesión.</p>
            <div class="botones-confirmacion">
                <button type="button" id="btnCancelarBorrado">Cancelar</button>
                <button type="button" id="btnConfirmarBorrado">Eliminar</button>
            </div>
        </div>
    </div>
</body>

</html>
