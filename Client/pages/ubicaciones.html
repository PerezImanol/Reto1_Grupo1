<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentroGestor - Ubicaciones</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/ubicaciones.css">

    <script src="../js/ubicaciones.js" defer></script>
</head>

<body>
    <header class="menu">

        <!-- Logo -->
        <a href="../pages/equipamientos.html" class="logo">
            <img src="../img/icon.png" alt="Logo CentroGestor">
            <span>CentroGestor</span>
        </a>

        <!-- Navegación -->
        <nav class="navegacion">

            <button id="btnEquip" class="nav-item activo">
                <img src="../img/equipamiento.png">
                <span>Equipamiento</span>
            </button>

            <button id="btnUbicacion" class="nav-item">
                <img src="../img/ubicacion.png">
                <span>Ubicación</span>
            </button>

            <button id="btnPanel" class="nav-item">
                <img src="../img/usuarios.png">
                <span>Panel Usuarios</span>
            </button>

        </nav>

        <!-- Acciones de la derecha -->
        <div class="acciones">

            <button id="btnNotificaciones" class="btn-notificaciones" aria-label="Notificaciones">
                <img src="../img/notificaciones.png">
            </button>

            <div class="separador"></div>

            <button id="btnPerfil" class="perfil">
                <img src="../img/usuario.png" class="avatar">

                <span class="datos-perfil">
                    <strong>Ana García</strong>
                    <small>Administradora</small>
                </span>

                <img src="../img/flecha.png" class="flecha">
            </button>
        </div>
    </header>
    <main>
        <section>
            <h1>Ubicaciones</h1>
            <p>Consulta y edita las ubicaciones de tus equipamientos.</p>
            <p>Actualizado</p>
        </section>
        <div>
            <table>
                <thead>
                    <tr>
                        <th id="total">Todas las ubicaciones</th>
                    </tr>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">Tabla sin contenido</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>Mostrando</td>
                        <td>seleccionada</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>
    <section>
        <div>
            <button class="btnSave">Guardar cambios</button>
            <button class="btnDelete">Borrar ubicacion</button>
        </div>
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name"><br />
        <label for="desc">Descripcion</label>
        <input type="text" id="desc" name="desc">
    </section>
    <footer>
        <p>CentroGestor · Gestion de activos</p>
        <p>Centro de ayuda</p> <!-- Necesita icono-->
    </footer>
</body>

</html>
