<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CentroGestor - Ubicaciones</title>
    <link rel="icon" href="../img/icon.png">

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/equipamiento.css">
    <link rel="stylesheet" href="../css/tema.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/ubicaciones.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="contenido">
            <h1>Ubicaciones</h1>
            <div class="barra-herramientas">
                <div class="grupo-busqueda">
                    <input type="search" id="buscarUbicacion" class="buscador" placeholder="Buscar ubicación..."
                        aria-label="Buscar ubicación">
                </div>

                <div class="acciones-equipamientos">
                    <button id="btnAnadir" class="boton-icono boton-anadir" aria-label="Añadir ubicación"
                        title="Añadir ubicación">
                        <img src="../img/añadir.png" alt="">
                    </button>

                    <button id="btnBorrar" class="boton-icono boton-borrar" aria-label="Borrar ubicación"
                        title="Borrar ubicación" disabled>
                        <img src="../img/borrar.png" alt="">
                    </button>
                </div>
            </div>
            <p class="mensaje-pagina-equipamientos" id="mensajeUbicaciones" role="status" aria-live="polite" hidden></p>
            <table>
                <thead>
                    <tr>
                        <th class="columna-seleccion"></th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody id="tablaEquipamientos">
                    <tr>
                        <td colspan="3" class="tabla-vacia">Cargando ubicaciones...</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="seccionModificar" class="modificar" hidden>
            <form id="formEquipamiento" hidden>
                <h2 id="tituloFormulario">Modificar ubicación</h2>
                <div class="campos-formulario">
                    <label>Nombre<input type="text" name="nombre" id="name" required></label>
                    <label>Descripción<input type="text" name="descripcion" id="desc" required></label>
                </div>
                <div class="botones-formulario">
                    <button type="submit" class="boton-accion">Guardar</button>
                    <button type="button" id="btnCancelar" class="boton-accion boton-cancelar">Cancelar</button>
                </div>
            </form>
        </section>
    </main>
    <div id="modalConfirmarBorrado" class="modal-confirmacion" hidden>
        <div class="contenido-modal" role="dialog" aria-modal="true" aria-labelledby="textoConfirmacionBorrado">
            <img src="../img/borrar.png" alt="" class="icono-confirmacion">
            <p id="textoConfirmacionBorrado">¿Seguro que quieres eliminar esta ubicación?</p>
            <div class="botones-confirmacion">
                <button type="button" id="btnCancelarBorrado">Cancelar</button>
                <button type="button" id="btnConfirmarBorrado">Eliminar</button>
            </div>
        </div>
    </div>
</body>

</html>
