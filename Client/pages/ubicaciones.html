<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentroGestor - Ubicaciones</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/ubicaciones.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/ubicaciones.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <main>
        <h1>Ubicaciones</h1>
        <section class="info">
            <p>Consulta y edita las ubicaciones de tus equipamientos.</p>
            <p>Actualizado</p>
        </section>
        <div class="tableView">
            <table>
                <thead>
                    <tr>
                        <th id="total" colspan="3">Todas las ubicaciones</th>
                    </tr>
                    <tr>
                        <th></th>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th class="right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableLocations">
                    <tr>
                        <td colspan="3">Tabla sin contenido</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2" id="show">Mostrando 0 de 0 ubicaciones</td>
                        <td></td>
                        <td class="right" id="select">Selecciona una ubicacion</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>
    <section class="border">
        <div class="buttons">
            <button id="btnSave">Guardar cambios</button>
        </div>
        <div id="text">
            <label for="name">Nombre</label><br />
            <input type="text" id="name" name="name" class="borderInput"><br />
            <label for="desc">Descripcion</label><br />
            <input type="text" id="desc" name="desc" class="borderInput">
        </div>
    </section>
    <footer class="info">
        <p>CentroGestor · Gestion de activos</p>
        <p>Centro de ayuda</p> <!-- Necesita icono-->
    </footer>
</body>

</html>
