<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentroGestor - Perfil</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/perfil.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/perfil.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <main>
        <h1>Perfil</h1>
        <section>
            <p>Edita tu perfil</p>
        </section>
        <div class="layout">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name">
            <label for="surname">Apellido:</label>
            <input type="text" id="surname" name="surname">
            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" name="username">
            <label for="role">Rol:</label>
            <input type="text" id="role" name="role">
            <button>Borrar cuenta</button> <!--Deshabilitado si usuario es admin-->
        </div>
        <p class="messageDefault" id="message" hidden></p>
    </main>
</body>

</html>
