<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentroGestor - Perfil</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/perfil.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/perfil.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <main>
        <h1>Perfil</h1>
        <section class="info">
            <p>Edita tu perfil</p>
        </section>
        <section id="position">
            <div class="layout">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" class="borderInput">
                <label for="surname">Apellido:</label>
                <input type="text" id="surname" name="surname" class="borderInput">
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" class="borderInput">
                <label for="role">Rol:</label>
                <input type="text" id="role" name="role" class="borderInput">
                <button id="btnSave">Editar datos</button>
                <button id="btnDelete">Borrar cuenta</button>
            </div>
        </section>
        <p class="messageDefault" id="message" hidden></p>
    </main>
</body>

</html>
