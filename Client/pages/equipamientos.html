
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CentroGestor - Equipamiento</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/equipamiento.css">

    <script src="../js/api.js" defer></script>
    <script src="../js/equipamientos.js" defer></script>
</head>

<body>

    <header class="menu">

        <a href="./equipamientos.html" class="logo">
            <img src="../img/icon.png" alt="Logo">
            <span>CentroGestor</span>
        </a>

        <nav class="navegacion">
            <a href="./equipamientos.html" class="nav-item activo">
                <img src="../img/equipamiento.png" alt="">
                <span>Equipamientos</span>
            </a>

            <a href="./ubicaciones.html" class="nav-item">
                <img src="../img/ubicacion.png" alt="">
                <span>Ubicaciones</span>
            </a>

            <a href="./usuarios.html" class="nav-item">
                <img src="../img/usuarios.png" alt="">
                <span>Usuarios</span>
            </a>
        </nav>

        <div class="acciones">

            <a href="./notificaciones.html" class="btn-notificaciones" aria-label="Notificaciones">
                <img src="../img/notificaciones.png" alt="">
            </a>

            <a href="./perfil.html" class="perfil">
                <img src="../img/usuario.png" alt="" class="avatar">

                <span class="datos-perfil">
                    <strong id="nombrePerfil">Ana García</strong>
                    <small id="rolPerfil">Administradora</small>
                </span>

                <img src="../img/flecha.png" alt="" class="flecha">
            </a>

        </div>

    </header>

    <main>
        <section class="contenido">

            <div class="barra-herramientas">
                <div class="buscador">
                    <input type="text" id="search" name="search" placeholder="Buscar equipamiento...">

                    <button id="btnBuscar" class="boton-icono" aria-label="Buscar">
                        <img src="../img/buscar.png" alt="">
                    </button>
                </div>
                <div class="filtro-columna">
                    <select id="columnaFiltro" aria-label="Columna por la que buscar">
                        <option value="nombre">Nombre</option>
                        <option value="descripcion">Descripción</option>
                        <option value="marca">Marca</option>
                        <option value="modelo">Modelo</option>
                        <option value="categoria">Categoría</option>
                        <option value="nombreUbicacion">Ubicación actual</option>
                    </select>

                    <img src="../img/filtrar.png" alt="">
                </div>

                <button id="btnAnadir" class="boton-icono boton-anadir" aria-label="Añadir equipamiento">
                    <img src="../img/añadir.png" alt="">
                </button>
                <button id="btnBorrar" class="boton-icono boton-borrar" aria-label="Borrar equipamiento" disabled>
                    <img src="../img/borrar.png" alt="">
                </button>

            </div>

            <table>
                <thead>
                    <tr>
                        <th class="columna-seleccion"></th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Categoría</th>
                        <th>Ubicación actual</th>
                    </tr>
                </thead>

                <tbody id="tablaEquipamientos">
                    <tr>
                        <td colspan="7">Cargando equipamientos...</td>
                    </tr>
                </tbody>
            </table>

        </section>

        <section id="seccionModificar" class="modificar" hidden>

            <form id="formEquipamiento" hidden>
                <h2 id="tituloFormulario">Modificar equipamiento</h2>
                <div class="campos-formulario">
                    <label>
                        Nombre
                        <input type="text" name="nombre" required>
                    </label>

                    <label>
                        Descripción
                        <input type="text" name="descripcion">
                    </label>

                    <label>
                        Marca
                        <input type="text" name="marca">
                    </label>

                    <label>
                        Modelo
                        <input type="text" name="modelo">
                    </label>

                    <label>
                        Categoría
                        <select name="categoria" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="PORTATIL">Portátil</option>
                            <option value="SOBREMESA">Sobremesa</option>
                            <option value="PERIFERICO">Periférico</option>
                            <option value="AUDIOVISUAL">Audiovisual</option>
                            <option value="OTROS">Otros</option>
                        </select>
                    </label>

                    <label>
                        Ubicación actual
                        <input type="text" name="nombreUbicacion">
                    </label>

                </div>

                <div class="botones-formulario">
                    <button type="submit" class="boton-accion">
                        Guardar
                    </button>

                    <button type="button" id="btnCancelar" class="boton-accion boton-cancelar">
                        Cancelar
                    </button>
                </div>
            </form>

        </section>
    </main>


</body>
</html>
