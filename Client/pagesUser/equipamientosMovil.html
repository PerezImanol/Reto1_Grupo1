<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CentroGestor - Equipamientos</title>

    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/equipamientosMovil.css">

    <script src="//code.jquery.com/jquery.min.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbarMovil.js" defer></script>
    <script src="../js/notificaciones.js" defer></script>
    <script src="../js/equipamientosMovil.js" defer></script>
</head>

<body>
    <div id="navbar-container"></div>

    <main class="pagina-equipamientos">

        <section class="encabezado-equipamientos">
            <div>
                <p class="etiqueta-pagina">CENTROGESTOR</p>
                <h1>Equipamientos</h1>
                <p class="descripcion-pagina">Consulta los equipos y actualiza su ubicación cuando sea necesario.</p>
            </div>

            <span class="total-equipamientos" id="totalEquipamientos">Cargando...</span>
        </section>

        <section class="controles-equipamientos" aria-label="Buscar y ordenar equipamientos">
            <div class="busqueda-equipamientos">
                <label class="texto-oculto" for="buscar">Buscar equipamiento</label>
                <input type="search" name="buscar" id="buscar" placeholder="Buscar por nombre, marca, modelo..." autocomplete="off">
                <button type="button" id="btnBuscar" aria-label="Buscar">
                    <img src="../img/buscar.png" alt="">
                </button>
            </div>
            <label class="ordenar-equipamientos" for="filtroCategoria">
                <span>Filtrar por categoría</span>
                <select id="filtroCategoria" name="categoria">
                    <option value="">Todas las categorías</option>
                    <option value="PORTATIL">Portátil</option>
                    <option value="SOBREMESA">Sobremesa</option>
                    <option value="PERIFERICO">Periférico</option>
                    <option value="AUDIOVISUAL">Audiovisual</option>
                    <option value="OTROS">Otros</option>
                </select>
            </label>
            <label class="ordenar-equipamientos" for="criterios-ordenacion">
                <span>Ordenar por</span>
                <select id="criterios-ordenacion" name="ordenar">
                    <option value="nAsc">Nombre A-Z</option>
                    <option value="nDesc">Nombre Z-A</option>
                    <option value="cAsc">Categoría A-Z</option>
                    <option value="cDesc">Categoría Z-A</option>
                </select>
            </label>
        </section>

        <p class="mensaje-equipamientos" id="mensajeEquipamientos" role="status" aria-live="polite" hidden></p>

        <section class="lista-equipamientos" id="listaEquipamientos" aria-label="Listado de equipamientos" aria-live="polite">
            <p class="estado-lista">Cargando equipamientos...</p>
        </section>

    </main>
</body>
</html>
